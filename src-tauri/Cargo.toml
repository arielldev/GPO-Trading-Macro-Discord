[package]
name = "trading-and-shi"
version = "2.0.0"
description = "Discord message scheduler"
edition = "2021"

[lib]
name = "trading_and_shi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
rand = "0.9"
regex = "1"
base64 = "0.22"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
